<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>報連相チェック集計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: 紺のヘッダー → 期間の選択 → 数字 → 平均・分布 → 推移 → 部署・声かけ → 個人別 → 個人の記録 → 自由記述 */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#14202e; --ink-2:#465264; --muted:#768194;
  --line:#e1e6ed; --line-2:#c9d1dc; --accent:#1f395f; --accent-ink:#ffffff; --accent-soft:#e7edf6;
  --bar:#1f395f; --bar-ink:#ffffff; --bar-2:#c4d0e2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --l1:#c43b3b; --l2:#ef9f9a; --l3:#d9d8d3; --l4:#86b6ef; --l5:#2a78d6;
  --l1-ink:#ffffff; --l2-ink:#14202e; --l3-ink:#14202e; --l4-ink:#14202e; --l5-ink:#ffffff;
  --seq:#1c5cab;
  --good:#0a7d0a; --good-bg:#e6f4e6; --warn:#8a5a00; --warn-bg:#fdf1d6; --crit:#b42f2f; --crit-bg:#fbe6e6; --info:#1f5fa8; --info-bg:#e5effa;
  --font:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
a{color:var(--info)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* ヘッダー */
.appbar{background:var(--bar);color:var(--bar-ink)}
.appbar-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:12px 0;display:grid;gap:8px}
.brand{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.brand h1{font-size:17px;font-weight:600;letter-spacing:.02em}
.brand .meta{font-size:12px;color:var(--bar-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.brand button{background:transparent;color:var(--bar-ink);border-color:var(--bar-2);min-height:28px;padding:2px 10px;font-size:12px}
.brand button:hover{background:rgba(255,255,255,.08)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:var(--bar-2);text-decoration:none;padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
.tabs a:hover{color:var(--bar-ink)}
.tabs a[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--bar-ink)}
.tabs .cnt{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:20px}
.wrap>.tabpanel{display:grid;gap:20px;min-width:0}
/* 共通部品 */
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;min-height:34px}
button{cursor:pointer}
button:hover{background:var(--accent-soft)}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.banner.warn{border-color:var(--warn);background:var(--warn-bg)}
.banner.crit{border-color:var(--crit);background:var(--crit-bg)}
.banner p{margin:0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.toolbar label{font-size:12px;color:var(--muted)}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .lab{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.kpi .val{font-size:28px;font-weight:600;line-height:1.2}
.kpi .val small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.kpi .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.flat{background:var(--line);color:var(--ink-2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.up{color:var(--good)} .down{color:var(--crit)} .flat{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 0;margin:0}
.skeleton{height:12px;border-radius:4px;background:var(--line);margin:8px 0}
.seg-btn{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg-btn button{border:0;border-radius:0;min-height:30px;padding:4px 12px;font-size:12px}
.seg-btn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* リスト */
.items{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item .body{min-width:0;overflow-wrap:anywhere}
.item .sub{font-size:12px;color:var(--muted)}
.item .side{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
/* 表 */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink-2);font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right}
td.nm{white-space:nowrap}
td.wrap{min-width:240px;overflow-wrap:anywhere}
td.heat{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;border-bottom:2px solid var(--surface)}
.big table{min-width:760px}
.low{color:var(--crit);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
/* レポート */
.reports{display:grid;gap:12px}
details.rep{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.rep>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
details.rep>summary::-webkit-details-marker{display:none}
details.rep>summary .t{font-weight:600}
details.rep>summary .s{font-size:12px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}
details.rep[open]>summary{border-bottom:1px solid var(--line)}
.rep-body{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px 24px}
.rep-sec h3{margin-bottom:4px;display:flex;gap:6px;align-items:center}
.rep-sec ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
.rep-sec li{overflow-wrap:anywhere}
.rep-sec.risk h3{color:var(--crit)}
/* アンケート */
.avg{display:grid;gap:14px}
.avg-row{display:grid;grid-template-columns:52px minmax(0,1fr) 96px;gap:10px;align-items:center}
.avg-name{display:flex;align-items:center;gap:6px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.track{position:relative;height:22px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track .bar{position:absolute;left:0;top:5px;height:12px;border-radius:0 4px 4px 0}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.avg-val{text-align:right;font-size:15px}
.avg-val .d{display:block;font-size:11px}
.dist{display:grid;gap:12px}
.dist-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.stack{display:flex;height:26px;gap:2px}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;min-width:0;overflow:hidden}
.seg:first-child{border-radius:4px 0 0 4px}.seg:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative;overflow-x:auto}
.chart svg{display:block}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-size:12px;color:var(--ink-2)}
.follow{display:grid;gap:10px}
.fcard{border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:0;padding:10px 12px;display:grid;gap:4px}
.fcard .who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.fcard .why{font-size:12px;color:var(--crit)}
.fcard .c{font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.vlist{display:grid;gap:10px}
.voice{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;min-width:0}
.voice .by{font-size:12px;color:var(--muted)}
.voice .t{white-space:pre-wrap;overflow-wrap:anywhere}
.privacy{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.privacy svg{flex:none}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .12s}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
@media (max-width:560px){.avg-row{grid-template-columns:44px minmax(0,1fr) 76px}.dist-row{grid-template-columns:44px minmax(0,1fr)}.kpi .val{font-size:24px}.appbar-in,.wrap{padding-inline:16px}}
html,body{margin:0}
.brand a.btn{color:var(--bar-ink);border:1px solid var(--bar-2);border-radius:6px;padding:2px 10px;font-size:12px;text-decoration:none;min-height:28px;display:inline-flex;align-items:center}
.brand a.btn:hover{background:rgba(255,255,255,.08)}

</style></head><body>
__APPBAR__
<main class="wrap">
  <section id="tab-survey" class="tabpanel">
    <div class="panel" style="display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between">
      <div class="toolbar">
        <span class="note">集計単位</span>
        <div class="seg-btn" role="group" aria-label="集計単位">
          <button type="button" id="unit-week" aria-pressed="true">週ごと</button>
          <button type="button" id="unit-month" aria-pressed="false">月ごと</button>
        </div>
        <label for="period" id="period-label">配信週（金曜）</label>
        <select id="period"><option>読み込み中…</option></select>
      </div>
      <div class="privacy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>委員会内での分析用。本人への共有や評価には使用しません。</div>
    </div>

    <div class="grid-kpi" id="sv-kpis">
      <div class="kpi"><div class="lab">回答者数</div><div class="val">–</div><div class="skeleton"></div></div>
      <div class="kpi"><div class="lab">回答率</div><div class="val">–</div><div class="skeleton"></div></div>
      <div class="kpi"><div class="lab">合計平均（15点満点）</div><div class="val">–</div><div class="skeleton"></div></div>
      <div class="kpi"><div class="lab">いちばん弱い項目</div><div class="val">–</div><div class="skeleton"></div></div>
    </div>

    <div class="two">
      <section class="panel" aria-labelledby="h-avg">
        <div class="panel-head"><h2 id="h-avg">項目別の平均</h2><span class="note" id="avg-note">5点満点</span></div>
        <div id="sv-avg" class="avg"><div class="skeleton"></div></div>
      </section>
      <section class="panel" aria-labelledby="h-dist">
        <div class="panel-head"><h2 id="h-dist">点数の分布</h2><span class="note" id="dist-note">人数</span></div>
        <div id="sv-dist" class="dist"><div class="skeleton"></div></div>
        <div class="legend" id="sv-dist-legend" style="margin-top:12px"></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="h-trend">
      <div class="panel-head"><h2 id="h-trend">推移</h2><span class="note" id="trend-note"></span></div>
      <div class="legend" id="sv-trend-legend" style="margin-bottom:8px"></div>
      <div class="chart" id="sv-trend"><div class="skeleton"></div></div>
      <div class="chart" id="sv-rate"></div>
      <details class="tbl"><summary>表で見る</summary><div class="tscroll" id="sv-trend-table"></div></details>
    </section>

    <div class="two">
      <section class="panel" aria-labelledby="h-dept">
        <div class="panel-head"><h2 id="h-dept">部署別の平均</h2>
          <div class="seg-btn" role="group" aria-label="部署別の集計期間">
            <button type="button" id="dept-sel" aria-pressed="true">選択した期間</button>
            <button type="button" id="dept-all" aria-pressed="false">全期間</button>
          </div>
        </div>
        <div class="tscroll" id="sv-dept"><div class="skeleton"></div></div>
        <p class="note" id="dept-note" style="margin:8px 0 0"></p>
      </section>
      <section class="panel" aria-labelledby="h-follow">
        <div class="panel-head"><h2 id="h-follow">声をかけたい人</h2><span class="note">2点以下の項目／合計9点以下／前の期間から3点以上低下</span></div>
        <div id="sv-follow" class="follow"><div class="skeleton"></div></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="h-people">
      <div class="panel-head"><h2 id="h-people">個人別</h2><span class="note" id="people-note">合計の低い順。行を押すと、その人の記録を下に表示します</span></div>
      <div class="tscroll" id="sv-people"><div class="skeleton"></div></div>
    </section>

    <section class="panel" aria-labelledby="h-person">
      <div class="panel-head"><h2 id="h-person">個人の記録</h2>
        <div class="toolbar"><label for="person">氏名</label><select id="person"></select></div>
      </div>
      <div id="sv-person"><div class="skeleton"></div></div>
    </section>

    <section class="panel" aria-labelledby="h-voice">
      <div class="panel-head"><h2 id="h-voice">自由記述</h2><span class="note" id="voice-note"></span></div>
      <div id="sv-voices" class="voices"><div class="skeleton"></div></div>
    </section>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<script>
(function(){
  "use strict";
  // ===== データ（Streamlit が読み込んで埋め込む） =====
  var VALUES = __VALUES__;
  var SETTINGS = __SETTINGS__;

  var ITEMS = [
    { key: "r", name: "報告", mark: "【報告】", color: "var(--s1)" },
    { key: "c", name: "連絡", mark: "【連絡】", color: "var(--s2)" },
    { key: "s", name: "相談", mark: "【相談】", color: "var(--s3)" }
  ];
  var LEVELS = {5:"10割できた",4:"9割できた",3:"8〜9割できた",2:"5〜8割できた",1:"5割未満"};
  var S = { tab: "survey", sv: { rows: [], cols: null, unit: "week", periods: [], period: null, deptScope: "sel", target: null, goal: null, person: null } };
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function fmt(n, d){ return (n == null || isNaN(n)) ? "–" : n.toFixed(d == null ? 2 : d); }
  function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0) / a.length : null; }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function md(key){ var p = key.split("-"); return p.length === 2 ? (+p[0]) + "年" + (+p[1]) + "月" : (+p[1]) + "/" + (+p[2]); }
  function today(){ return ymd(new Date()); }
  function uniq(a){ return Array.from(new Set(a)).filter(function(x){ return x !== "" && x != null; }); }
  function fillSelect(el, opts, allLabel, keep){
    var v = keep != null ? keep : el.value;
    el.innerHTML = (allLabel ? '<option value="">' + allLabel + '</option>' : "") + opts.map(function(o){ var val = o.value != null ? o.value : o, lab = o.label != null ? o.label : o; return '<option value="' + esc(val) + '">' + esc(lab) + '</option>'; }).join("");
    if (v && Array.prototype.some.call(el.options, function(o){ return o.value === v; })) el.value = v;
  }


  // ===== アンケート：解析 =====
  function parseStamp(s){ var m = String(s).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); return m ? new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0)) : null; }
  function fridayOf(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() - 5 + 7) % 7); return ymd(x); }
  function score(v){ var m = String(v || "").match(/^\s*([1-5])/); return m ? +m[1] : null; }
  function shortHeader(h){ return String(h).replace(/^\s*\d+\.\s*/, "").replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim(); }
  function parseSurvey(values){
    var sv = S.sv;
    if (!values || !values.length){ sv.rows = []; return; }
    var head = values[0].map(String), cols = { name: -1, dept: -1, free: [] };
    head.forEach(function(h, i){
      if (/氏名|名前/.test(h) && cols.name < 0) cols.name = i;
      else if (/部署|所属/.test(h) && cols.dept < 0) cols.dept = i;
      ITEMS.forEach(function(it){ if (h.indexOf(it.mark) >= 0) cols[it.key] = i; });
    });
    var lastScore = Math.max.apply(null, ITEMS.map(function(it){ return cols[it.key]; }).filter(function(i){ return i != null; }).concat([0]));
    head.forEach(function(h, i){ if (i > lastScore && h.trim()) cols.free.push({ idx: i, label: shortHeader(h) }); });
    sv.cols = cols;
    var byKey = {};
    values.slice(1).forEach(function(r){
      var d = parseStamp(r[0]); if (!d) return;
      var rec = { at: d, week: fridayOf(d), name: String(r[cols.name] || "").trim() || "（氏名なし）", dept: String(r[cols.dept] || "").trim() || "未記入", free: {} };
      rec.month = rec.week.slice(0, 7); rec.key = rec.name.replace(/\s+/g, "");
      ITEMS.forEach(function(it){ rec[it.key] = cols[it.key] != null ? score(r[cols[it.key]]) : null; });
      if (ITEMS.some(function(it){ return rec[it.key] == null; })) return;
      rec.total = rec.r + rec.c + rec.s;
      cols.free.forEach(function(f){ var t = String(r[f.idx] || "").trim(); if (t) rec.free[f.idx] = t; });
      var k = rec.week + "|" + rec.key;
      if (!byKey[k] || byKey[k].at < rec.at) byKey[k] = rec;          // 同じ週の再回答は最新を採用
    });
    sv.rows = Object.keys(byKey).map(function(k){ return byKey[k]; });
  }
  function parseSettings(values){
    var t = null, g = null;
    (values || []).forEach(function(r){
      var lab = String(r[0] || "");
      if (/対象人数/.test(lab)) { var n = parseFloat(String(r[1]).replace(/[^\d.]/g, "")); if (n > 0) t = n; }
      if (/回答率の目標/.test(lab)) { var s = String(r[1] || ""), v = parseFloat(s.replace(/[^\d.]/g, "")); if (!isNaN(v)) g = /%/.test(s) || v > 1 ? v / 100 : v; }
    });
    S.sv.target = t; S.sv.goal = g;
  }

    $("sv-voices").innerHTML = cols.length ? cols.map(function(f){
      var items = rows.filter(function(r){ return r.free[f.idx]; }); total += items.length;
      return '<div><h3 style="margin-bottom:8px">' + esc(f.label) + ' <span class="note num">' + items.length + '件</span></h3><div class="vlist">' + (items.length ? items.map(function(r){ return '<div class="voice"><div class="by">' + esc(r.name) + '・' + esc(r.dept) + (isWeek() ? "" : '・' + md(r.week) + '週') + '</div><div class="t">' + esc(r.free[f.idx]) + '</div></div>'; }).join("") : '<p class="empty">記入はありません。</p>') + '</div></div>';
    }).join("") : '<p class="empty">自由記述の設問が見つかりません。</p>';
    $("voice-note").textContent = plab(S.sv.period) + "の記入 " + total + "件";
  }


  // ===== 高さを中身に合わせる（Streamlit の枠の中で、二重のスクロールを出さない） =====
  function fit(){ try { if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height + 8) + "px"; } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);

  // ===== 操作 =====
  $("period").addEventListener("change", function(e){ S.sv.period = e.target.value; renderSurvey(); });
  function setUnit(u){
    if (S.sv.unit === u) return;
    var cur = S.sv.period; S.sv.unit = u;
    if (cur) S.sv.period = u === "month" ? cur.slice(0, 7) : (uniq(S.sv.rows.filter(function(r){ return r.month === cur; }).map(function(r){ return r.week; })).sort().reverse()[0] || null);
    $("unit-week").setAttribute("aria-pressed", String(u === "week")); $("unit-month").setAttribute("aria-pressed", String(u === "month"));
    renderSurvey();
  }
  $("unit-week").addEventListener("click", function(){ setUnit("week"); });
  $("unit-month").addEventListener("click", function(){ setUnit("month"); });
  $("dept-sel").addEventListener("click", function(){ S.sv.deptScope = "sel"; this.setAttribute("aria-pressed", "true"); $("dept-all").setAttribute("aria-pressed", "false"); svDept(); });
  $("dept-all").addEventListener("click", function(){ S.sv.deptScope = "all"; this.setAttribute("aria-pressed", "true"); $("dept-sel").setAttribute("aria-pressed", "false"); svDept(); });
  $("person").addEventListener("change", function(e){ S.sv.person = e.target.value; svPeople(); svPerson(); });
  function pickPerson(tr){ S.sv.person = tr.getAttribute("data-person"); svPeople(); svPerson(); $("h-person").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
  $("sv-people").addEventListener("click", function(e){ var tr = e.target.closest("tr[data-person]"); if (tr) pickPerson(tr); });
  $("sv-people").addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ var tr = e.target.closest("tr[data-person]"); if (tr){ e.preventDefault(); pickPerson(tr); } } });
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ if (S.sv.period){ svTrend(); svPerson(); } }, 150); });
  var tip = $("tip");
  document.addEventListener("pointermove", function(e){
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t){ tip.style.opacity = 0; return; }
    tip.textContent = t.getAttribute("data-tip");
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
  });

  // ===== 起動 =====
  parseSettings(SETTINGS);
  parseSurvey(VALUES);
  renderSurvey();
  fit();
})();
</script>
